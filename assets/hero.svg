    <text x="450" y="25" text-anchor="middle" class="t" fill="#8496b0">yanivbahalul@hit : ~/profile : zsh</text>

    <g class="l l1">
      <text x="32" y="82" class="m"><tspan fill="#5cc8ee">$</tspan> <tspan fill="#e8eef5">whoami</tspan></text>
      <text x="32" y="108" class="m" fill="#e8eef5"><tspan font-weight="700" font-size="19">Yaniv Bahalul</tspan><tspan fill="#8496b0">   B.Sc. Computer Science, HIT</tspan></text>
    </g>
    <g class="l l2">
      <text x="32" y="144" class="m"><tspan fill="#5cc8ee">$</tspan> <tspan fill="#e8eef5">cat focus.txt</tspan></text>
      <text x="32" y="170" class="m"><tspan fill="#ff6b7f">Swift apps</tspan><tspan fill="#8496b0">  +  </tspan><tspan fill="#7cc7e6">deep learning</tspan><tspan fill="#8496b0">  +  </tspan><tspan fill="#e63950">security systems</tspan></text>
    </g>
    <g class="l l3">
      <text x="32" y="206" class="m"><tspan fill="#5cc8ee">$</tspan> <tspan fill="#e8eef5">gh stats yanivbahalul</tspan></text>
      <text x="32" y="232" class="m"><tspan fill="#7cc7e6">10</tspan> <tspan fill="#8496b0">repos</tspan>   <tspan fill="#ff6b7f">30</tspan> <tspan fill="#8496b0">stars</tspan>   <tspan fill="#a0bdd0">8</tspan> <tspan fill="#8496b0">followers</tspan>   <tspan fill="#ff6b7f">584</tspan> <tspan fill="#8496b0">contributions / yr</tspan></text>
    </g>
    <g class="l l4">
      <text x="32" y="266" class="m" fill="#8496b0"># languages by bytes</text>
    </g>
