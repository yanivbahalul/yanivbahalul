    </g>
    <g class="l l5">
      <g transform="translate(0,0)"><circle cx="37" cy="317" r="5" fill="#3fb1dd"/><text x="50" y="322" class="m" fill="#e8eef5">C#</text><text x="78" y="322" class="m" fill="#8496b0">28%</text><circle cx="319" cy="317" r="5" fill="#e63950"/><text x="332" y="322" class="m" fill="#e8eef5">JavaScript</text><text x="433" y="322" class="m" fill="#8496b0">19%</text><circle cx="601" cy="317" r="5" fill="#a0bdd0"/><text x="614" y="322" class="m" fill="#e8eef5">Jupyter</text><text x="688" y="322" class="m" fill="#8496b0">19%</text><circle cx="37" cy="343" r="5" fill="#be2d40"/><text x="50" y="348" class="m" fill="#e8eef5">Swift</text><text x="105" y="348" class="m" fill="#8496b0">13%</text><circle cx="319" cy="343" r="5" fill="#2d8fb8"/><text x="332" y="348" class="m" fill="#e8eef5">TypeScript</text><text x="433" y="348" class="m" fill="#8496b0">11%</text><circle cx="601" cy="343" r="5" fill="#596b86"/><text x="614" y="348" class="m" fill="#e8eef5">Python</text><text x="678" y="348" class="m" fill="#8496b0">8%</text></g>
    </g>
    <g class="l l6">
      <text x="32" y="386" class="m"><tspan fill="#5cc8ee">$</tspan> <tspan class="cur" fill="#e8eef5">_</tspan></text>
    </g>
