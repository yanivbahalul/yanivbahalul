<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404" role="img" aria-label="Yaniv Bahalul: Computer Science student at HIT. Swift apps, deep learning, security systems.">
  <style>
    .m { font: 15px 'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace; }
    .t { font: 600 13px -apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
    .l { animation: rise .6s ease-out backwards; }
    .l1 { animation-delay: .1s } .l2 { animation-delay: .5s } .l3 { animation-delay: .9s }
    .l4 { animation-delay: 1.3s } .l5 { animation-delay: 1.7s } .l6 { animation-delay: 2.1s }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s ease-out 2.2s backwards; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <clipPath id="win"><rect width="900" height="404" rx="14"/></clipPath>
    <clipPath id="bar"><rect x="32" y="0" width="836" height="14" rx="7"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb1dd" stop-opacity=".0"/>
      <stop offset=".5" stop-color="#a0bdd0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#e63950" stop-opacity=".0"/>
    </linearGradient>
  </defs>
