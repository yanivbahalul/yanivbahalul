    </g>
    <g class="l l5">
      <g transform="translate(0,0)"><circle cx="37" cy="317" r="5" fill="#178600"/><text x="50" y="322" class="m" fill="#e6edf3">C#</text><text x="78" y="322" class="m" fill="#8b949e">29%</text><circle cx="319" cy="317" r="5" fill="#f1e05a"/><text x="332" y="322" class="m" fill="#e6edf3">JavaScript</text><text x="433" y="322" class="m" fill="#8b949e">20%</text><circle cx="601" cy="317" r="5" fill="#da5b0b"/><text x="614" y="322" class="m" fill="#e6edf3">Jupyter</text><text x="688" y="322" class="m" fill="#8b949e">20%</text><circle cx="37" cy="343" r="5" fill="#f05138"/><text x="50" y="348" class="m" fill="#e6edf3">Swift</text><text x="105" y="348" class="m" fill="#8b949e">13%</text><circle cx="319" cy="343" r="5" fill="#3178c6"/><text x="332" y="348" class="m" fill="#e6edf3">TypeScript</text><text x="433" y="348" class="m" fill="#8b949e">12%</text><circle cx="601" cy="343" r="5" fill="#3572a5"/><text x="614" y="348" class="m" fill="#e6edf3">Python</text><text x="678" y="348" class="m" fill="#8b949e">7%</text></g>
    </g>
    <g class="l l6">
      <text x="32" y="386" class="m"><tspan fill="#7ee787">$</tspan> <tspan class="cur" fill="#e6edf3">_</tspan></text>
    </g>
