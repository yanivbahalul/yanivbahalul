    <circle cx="26" cy="20" r="6" fill="#ff5f56"/><circle cx="46" cy="20" r="6" fill="#ffbd2e"/><circle cx="66" cy="20" r="6" fill="#27c93f"/>
    <text x="450" y="25" text-anchor="middle" class="t" fill="#8b949e">yanivbahalul@hit : ~/profile : zsh</text>

    <g class="l l1">
      <text x="32" y="82" class="m"><tspan fill="#7ee787">$</tspan> <tspan fill="#e6edf3">whoami</tspan></text>
      <text x="32" y="108" class="m" fill="#e6edf3"><tspan font-weight="700" font-size="19">Yaniv Bahalul</tspan><tspan fill="#8b949e">   B.Sc. Computer Science, HIT</tspan></text>
    </g>
    <g class="l l2">
      <text x="32" y="144" class="m"><tspan fill="#7ee787">$</tspan> <tspan fill="#e6edf3">cat focus.txt</tspan></text>
      <text x="32" y="170" class="m"><tspan fill="#ffa657">Swift apps</tspan><tspan fill="#8b949e">  +  </tspan><tspan fill="#79c0ff">deep learning</tspan><tspan fill="#8b949e">  +  </tspan><tspan fill="#ff7b72">security systems</tspan></text>
    </g>
    <g class="l l3">
      <text x="32" y="206" class="m"><tspan fill="#7ee787">$</tspan> <tspan fill="#e6edf3">gh stats yanivbahalul</tspan></text>
      <text x="32" y="232" class="m"><tspan fill="#79c0ff">10</tspan> <tspan fill="#8b949e">repos</tspan>   <tspan fill="#ffa657">30</tspan> <tspan fill="#8b949e">stars</tspan>   <tspan fill="#d2a8ff">8</tspan> <tspan fill="#8b949e">followers</tspan>   <tspan fill="#ffa657">1,524</tspan> <tspan fill="#8b949e">contributions / yr</tspan></text>
    </g>
    <g class="l l4">
      <text x="32" y="266" class="m" fill="#8b949e"># languages by bytes</text>
    </g>
