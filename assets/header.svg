<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Yaniv Bahalul. Swift apps, deep learning, security systems.">
  <style>
    .blob { animation: drift 14s ease-in-out infinite alternate; }
    .b2 { animation-duration: 18s; animation-direction: alternate-reverse; }
    .b3 { animation-duration: 22s; }
    .wv { animation: slide linear infinite; }
    .ph { opacity: 0; animation: cycle 12s infinite; }
    .ph0 { opacity: 1; }
    .ph1 { animation-delay: 4s; } .ph2 { animation-delay: 8s; }
    .name { animation: rise 1.1s cubic-bezier(.2,.7,.2,1) backwards; }
    .chip { animation: rise 1.1s .3s cubic-bezier(.2,.7,.2,1) backwards; }
    .shine { animation: shine 5s ease-in-out 1.4s infinite; }
    @keyframes drift { from { transform: translate(-40px,-10px); } to { transform: translate(60px,25px); } }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(var(--shift)); } }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(10px); } 6%,30% { opacity: 1; transform: none; } 36%,100% { opacity: 0; transform: translateY(-10px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes shine { 0% { transform: translateX(-260px); } 60%,100% { transform: translateX(980px); } }
  </style>
  <defs>
    <clipPath id="cp"><rect width="900" height="300" rx="14"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#d6e8f3"/><stop offset="1" stop-color="#ffc9d0"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7cc7e6"/><stop offset=".55" stop-color="#c9d8e6"/><stop offset="1" stop-color="#ff8a9a"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".07"/></pattern>
    <clipPath id="nameclip"><text x="60" y="124" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="-2">Yaniv Bahalul</text></clipPath>
  </defs>
  <g clip-path="url(#cp)">
    <rect width="900" height="300" fill="#070a12"/>
    <g filter="url(#blur)" opacity=".95">
      <circle class="blob" cx="170" cy="70" r="120" fill="#2d8fb8" fill-opacity=".60"/>
      <circle class="blob b2" cx="520" cy="40" r="130" fill="#be2d40" fill-opacity=".62"/>
      <circle class="blob b3" cx="800" cy="150" r="120" fill="#325675" fill-opacity=".75"/>
    </g>
    <rect width="900" height="300" fill="url(#dots)"/>
    <g class="chip">
      <rect x="64" y="32" width="224" height="26" rx="13" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
      <circle cx="82" cy="45" r="4" fill="#5cc8ee"/>
      <text x="96" y="50" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#c7d3e3">B.Sc. Computer Science, HIT</text>
    </g>
    <g class="name">
      <text x="60" y="124" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="-2" fill="url(#nm)">Yaniv Bahalul</text>
      <g clip-path="url(#nameclip)"><rect class="shine" x="0" y="50" width="120" height="90" fill="url(#sh)" transform="skewX(-20)"/></g>
    </g>
    <text class="ph ph0" x="64" y="186" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="20" fill="url(#acc)"><tspan fill="#8496b0">&gt; </tspan>Swift apps that run on-device</text><text class="ph ph1" x="64" y="186" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="20" fill="url(#acc)"><tspan fill="#8496b0">&gt; </tspan>Deep learning I measure honestly</text><text class="ph ph2" x="64" y="186" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="20" fill="url(#acc)"><tspan fill="#8496b0">&gt; </tspan>Security systems that fight back</text>
