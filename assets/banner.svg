<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Yaniv Bahalul - Computer Science student building Apple apps, deep learning and security tools" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#151a3a"/>
      <stop offset="1" stop-color="#2a1a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowA" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>

  <style>
    .name { font: 700 56px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: -1px; }
    .role { font: 500 22px 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: url(#accent); }
    .tag  { font: 400 15px 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #94a3b8; }
    .tok  { font: 600 15px 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #ffffff; fill-opacity: 0.10; }
    .fade { animation: fadeUp 0.9s ease-out backwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.6s; }
    .float1 { animation: drift 9s ease-in-out infinite alternate; }
    .float2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drift { from { transform: translateY(0); } to { transform: translateY(-14px); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>
    <rect width="1000" height="260" fill="url(#glowA)"/>
    <rect width="1000" height="260" fill="url(#glowB)"/>

    <!-- floating code tokens -->
    <g class="float1">
      <text class="tok" x="700" y="70">HKHealthStore()</text>
      <text class="tok" x="760" y="170">torch.nn.Module</text>
    </g>
    <g class="float2">
      <text class="tok" x="590" y="130">docker compose up</text>
      <text class="tok" x="800" y="225">NaiveBayes.fit()</text>
      <text class="tok" x="640" y="215">trap.detect()</text>
    </g>

    <rect x="56" y="58" width="6" height="146" rx="3" fill="url(#accent)"/>

    <text class="name fade d1" x="84" y="112">Yaniv Bahalul</text>
    <text class="role fade d2" x="86" y="156">CS student &#183; Swift &#183; Deep Learning &#183; Security<tspan class="cursor"> _</tspan></text>
    <text class="tag fade d3" x="86" y="196">Building apps that run on-device, models that I measure honestly,</text>
    <text class="tag fade d3" x="86" y="218">and systems that fight back.</text>
  </g>
</svg>
