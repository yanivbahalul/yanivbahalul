<svg xmlns="http://www.w3.org/2000/svg" width="460" height="232" viewBox="0 0 460 232" role="img" aria-label="fitness-google-sync: Google Health to Apple Health">
  <defs><clipPath id="c"><rect width="460" height="232" rx="14"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f05138"/><stop offset="1" stop-color="#f05138" stop-opacity=".15"/></linearGradient>
    <radialGradient id="r" cx="1" cy="0" r="1"><stop offset="0" stop-color="#f05138" stop-opacity=".22"/><stop offset="1" stop-color="#f05138" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="460" height="232" fill="#0d1117"/>
    <rect width="460" height="232" fill="url(#r)"/>
    <rect width="460" height="4" fill="url(#g)"/>
  </g>
  <rect x=".5" y=".5" width="459" height="231" rx="14" fill="none" stroke="#30363d"/>
  <circle cx="30" cy="38" r="5" fill="#f05138"/>
  <text x="44" y="43" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf3">fitness-google-sync</text>
  <text x="434" y="43" text-anchor="end" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#f05138">17 data types</text>
  <text x="26" y="72" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Google Health to Apple Health</text>
  <line x1="26" y1="84" x2="434" y2="84" stroke="#30363d"/>
  <text x="26" y="110" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" fill-opacity=".86">iOS app that syncs a fitness band into Apple Health,</text><text x="26" y="129" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" fill-opacity=".86">with a Hebrew food diary, AI meal photos and calorie</text><text x="26" y="148" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" fill-opacity=".86">balance. Fully on-device, no server.</text>
  <rect x="26.0" y="192" width="57.0" height="24" rx="12" fill="#21262d" stroke="#30363d"/><text x="54.5" y="208" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#8b949e">Swift</text><rect x="91.0" y="192" width="86.6" height="24" rx="12" fill="#21262d" stroke="#30363d"/><text x="134.3" y="208" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#8b949e">HealthKit</text><rect x="185.6" y="192" width="42.2" height="24" rx="12" fill="#21262d" stroke="#30363d"/><text x="206.7" y="208" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#8b949e">iOS</text>
