<svg xmlns="http://www.w3.org/2000/svg" width="460" height="232" viewBox="0 0 460 232" role="img" aria-label="Riddick: Low-light image &amp; video enhancement">
  <defs><clipPath id="c"><rect width="460" height="232" rx="14"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e63950"/><stop offset="1" stop-color="#e63950" stop-opacity=".15"/></linearGradient>
    <radialGradient id="r" cx="1" cy="0" r="1"><stop offset="0" stop-color="#e63950" stop-opacity=".22"/><stop offset="1" stop-color="#e63950" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="460" height="232" fill="#0b0f19"/>
    <rect width="460" height="232" fill="url(#r)"/>
    <rect width="460" height="4" fill="url(#g)"/>
  </g>
  <rect x=".5" y=".5" width="459" height="231" rx="14" fill="none" stroke="#26344b"/>
  <circle cx="30" cy="38" r="5" fill="#e63950"/>
  <text x="44" y="43" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e8eef5">Riddick</text>
  <text x="434" y="43" text-anchor="end" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#e63950">3.55x less noise</text>
  <text x="26" y="72" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8496b0">Low-light image &amp; video enhancement</text>
  <line x1="26" y1="84" x2="434" y2="84" stroke="#26344b"/>
  <text x="26" y="110" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#e8eef5" fill-opacity=".86">Built from scratch in PyTorch toward a live night</text><text x="26" y="129" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#e8eef5" fill-opacity=".86">camera. Multi-frame merging cuts noise 3.55x from 72</text><text x="26" y="148" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#e8eef5" fill-opacity=".86">frames at ~45 fps. The write-up keeps the failed</text><text x="26" y="167" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#e8eef5" fill-opacity=".86">experiments too.</text>
  <rect x="26.0" y="192" width="64.4" height="24" rx="12" fill="#1a2438" stroke="#26344b"/><text x="58.2" y="208" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#8496b0">Python</text><rect x="98.4" y="192" width="71.8" height="24" rx="12" fill="#1a2438" stroke="#26344b"/><text x="134.3" y="208" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#8496b0">PyTorch</text><rect x="178.2" y="192" width="108.8" height="24" rx="12" fill="#1a2438" stroke="#26344b"/><text x="232.6" y="208" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#8496b0">Raspberry Pi</text>
</svg>
