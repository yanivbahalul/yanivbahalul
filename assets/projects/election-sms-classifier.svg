  <text x="26" y="110" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" fill-opacity=".86">Classifies campaign SMS as political or not. Multinomial</text><text x="26" y="129" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" fill-opacity=".86">Naive Bayes written from scratch in NumPy, with</text><text x="26" y="148" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" fill-opacity=".86">train-only cross-validation and an untouched test split.</text>
