<svg xmlns="http://www.w3.org/2000/svg" width="460" height="232" viewBox="0 0 460 232" role="img" aria-label="Myinstants-MacOS: Native soundboard for macOS">
  <defs><clipPath id="c"><rect width="460" height="232" rx="14"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bf5af2"/><stop offset="1" stop-color="#bf5af2" stop-opacity=".15"/></linearGradient>
    <radialGradient id="r" cx="1" cy="0" r="1"><stop offset="0" stop-color="#bf5af2" stop-opacity=".22"/><stop offset="1" stop-color="#bf5af2" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="460" height="232" fill="#0d1117"/>
    <rect width="460" height="232" fill="url(#r)"/>
    <rect width="460" height="4" fill="url(#g)"/>
  </g>
  <rect x=".5" y=".5" width="459" height="231" rx="14" fill="none" stroke="#30363d"/>
  <circle cx="30" cy="38" r="5" fill="#bf5af2"/>
  <text x="44" y="43" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Myinstants-MacOS</text>
  <text x="434" y="43" text-anchor="end" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#bf5af2">Ad-free</text>
  <text x="26" y="72" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">Native soundboard for macOS</text>
  <line x1="26" y1="84" x2="434" y2="84" stroke="#30363d"/>
  <text x="26" y="110" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" fill-opacity=".86">Unofficial app for myinstants.com: browse, play,</text><text x="26" y="129" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" fill-opacity=".86">favorite, upload and delete sound buttons, with</text><text x="26" y="148" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" fill-opacity=".86">automatic upload prep and bundled ffmpeg.</text>
  <rect x="26.0" y="192" width="57.0" height="24" rx="12" fill="#21262d" stroke="#30363d"/><text x="54.5" y="208" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#8b949e">Swift</text><rect x="91.0" y="192" width="57.0" height="24" rx="12" fill="#21262d" stroke="#30363d"/><text x="119.5" y="208" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#8b949e">macOS</text><rect x="156.0" y="192" width="64.4" height="24" rx="12" fill="#21262d" stroke="#30363d"/><text x="188.2" y="208" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#8b949e">ffmpeg</text>
