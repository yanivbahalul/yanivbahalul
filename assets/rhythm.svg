<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Contribution momentum by month and by weekday. Busiest month October with 147 contributions; busiest weekday Fri.">
  <style>
    .s { font: 11px 'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace; }
    .ln { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out .2s forwards; }
    .ar { animation: fadein 1.4s ease-out 1.4s backwards; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.2,.7,.2,1) backwards; }
    .dot { transform-box: fill-box; transform-origin: center; animation: beat 2s ease-in-out 2.6s infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fadein { from { opacity: 0; } }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.8); } }
  </style>
  <defs>
    <clipPath id="cp"><rect width="900" height="300" rx="14"/></clipPath>
    <linearGradient id="la" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fb1dd"/><stop offset=".55" stop-color="#a0bdd0"/><stop offset="1" stop-color="#e63950"/></linearGradient>
    <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e63950" stop-opacity=".42"/><stop offset="1" stop-color="#e63950" stop-opacity="0"/></linearGradient>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fb1dd"/><stop offset="1" stop-color="#e63950"/></linearGradient>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#cp)"><rect width="900" height="300" fill="#0b0f19"/><rect width="900" height="2" fill="url(#la)" fill-opacity=".8"/></g>
  <rect x=".5" y=".5" width="899" height="299" rx="14" fill="none" stroke="#26344b"/>
  <text x="32" y="38" font-family="'SF Mono','Menlo','Consolas','DejaVu Sans Mono','Liberation Mono',monospace" font-size="14" font-weight="600" fill="#e8eef5"><tspan fill="#5cc8ee">$</tspan> ./rhythm --monthly --weekday</text>
  <text x="48" y="62" class="s" fill="#8496b0">contributions per month (sqrt scale)</text>
  <text x="610" y="62" class="s" fill="#8496b0">contributions per weekday</text>
