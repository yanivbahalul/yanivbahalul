<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="Tech stack: Apple (Swift, HealthKit, macOS), ML and data (Python, PyTorch, NumPy, Jupyter), backend and security (TypeScript, C#, Docker, MongoDB, Socket.IO).">
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.3); opacity: 0; } }
    .pl { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-out infinite; }
    .pl2 { animation-delay: 1.6s; }
    .r0 { transform-origin: 450px 250px; animation: spin 46s linear infinite normal; }.u0 { transform-box: fill-box; transform-origin: center; animation: spin 46s linear infinite reverse; }
    .r1 { transform-origin: 450px 250px; animation: spin 62s linear infinite reverse; }.u1 { transform-box: fill-box; transform-origin: center; animation: spin 62s linear infinite normal; }
    .r2 { transform-origin: 450px 250px; animation: spin 84s linear infinite normal; }.u2 { transform-box: fill-box; transform-origin: center; animation: spin 84s linear infinite reverse; }
    
  </style>
  <defs>
    <clipPath id="cp"><rect width="900" height="500" rx="14"/></clipPath>
    <radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a371f7"/><stop offset="1" stop-color="#3b82f6"/></radialGradient>
    <radialGradient id="bgl" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#7c3aed" stop-opacity=".22"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#cp)"><rect width="900" height="500" fill="#0d1117"/><rect width="900" height="500" fill="url(#bgl)"/></g>
